<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Over Margin 12x — Intro Hook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #e63946;
            --dark-red: #9d0208;
            --orange: #fb8500;
            --dark-bg: #0a0a0a;
            --darker-bg: #050505;
            --text-light: #ffffff;
            --text-gray: #b0b0b0;
            --gradient-1: linear-gradient(135deg, #e63946 0%, #fb8500 100%);
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-light);
        }

        /* ---------- Stage (the recordable area) ---------- */

        .stage {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        /* Background layer: slow zoom keeps the frame "alive" from frame one */
        .bg {
            position: absolute;
            inset: -6%;
            background:
                radial-gradient(ellipse at 30% 70%, rgba(157, 2, 8, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 25%, rgba(251, 133, 0, 0.14) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(230, 57, 70, 0.10) 0%, transparent 65%),
                #030303;
            transform: scale(1);
            opacity: 0;
        }

        .stage.playing .bg {
            animation:
                bgReveal 1.4s ease-out forwards,
                bgZoom 6.5s linear forwards;
        }

        @keyframes bgReveal {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes bgZoom {
            from { transform: scale(1); }
            to   { transform: scale(1.07); }
        }

        /* Faint drifting grain so black areas never look like a frozen frame */
        .grain {
            position: absolute;
            inset: -10%;
            opacity: 0;
            background-image: radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1px);
            background-size: 3px 3px;
            mix-blend-mode: overlay;
        }

        .stage.playing .grain {
            opacity: 0.5;
            animation: grainDrift 6.5s linear forwards;
        }

        @keyframes grainDrift {
            from { transform: translate(0, 0); }
            to   { transform: translate(-2%, -1.5%); }
        }

        /* Vignette to focus the eye on the text */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.85) 100%);
            pointer-events: none;
        }

        /* ---------- The hook text ---------- */

        .hook {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 900px;
            padding: 0 6vw;
        }

        .hook-kicker {
            font-size: clamp(0.7rem, 1.2vw, 0.95rem);
            letter-spacing: 0.55em;
            text-transform: uppercase;
            color: var(--text-gray);
            margin-bottom: 2.2rem;
            opacity: 0;
        }

        .stage.playing .hook-kicker {
            animation: lineUp 1.1s ease-out 0.7s forwards;
        }

        .hook-line {
            font-size: clamp(1.6rem, 4.2vw, 3.4rem);
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: 0.01em;
            opacity: 0;
        }

        .stage.playing .hook-line {
            animation: lineUp 1.3s cubic-bezier(0.16, 1, 0.3, 1) 1.3s forwards;
        }

        .hook-line em {
            font-style: normal;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hook-punch {
            margin-top: 1.6rem;
            font-size: clamp(1.1rem, 2.4vw, 1.9rem);
            font-weight: 600;
            color: var(--text-gray);
            opacity: 0;
        }

        .stage.playing .hook-punch {
            animation: lineUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 2.9s forwards;
        }

        @keyframes lineUp {
            from {
                opacity: 0;
                transform: translateY(22px);
                filter: blur(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* Whole hook fades out just before the beat drops */
        .stage.playing .hook {
            animation: hookOut 0.7s ease-in 5.2s forwards;
        }

        @keyframes hookOut {
            to {
                opacity: 0;
                transform: scale(1.04);
                filter: blur(8px);
            }
        }

        /* Final beat marker: brief brand flash right where the music starts */
        .beat-mark {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            z-index: 3;
            opacity: 0;
            pointer-events: none;
        }

        .stage.playing .beat-mark {
            animation: beatIn 0.45s ease-out 5.85s forwards;
        }

        @keyframes beatIn {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .beat-mark .brand {
            font-size: clamp(1.4rem, 3vw, 2.4rem);
            font-weight: 900;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .beat-mark .cue {
            font-size: clamp(0.7rem, 1.1vw, 0.9rem);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--text-gray);
        }

        /* ---------- Operator controls (never part of the recording) ---------- */

        .controls {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
            transition: opacity 0.35s, visibility 0.35s;
        }

        .controls.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .controls h1 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .controls h1 span {
            background: var(--gradient-1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .theme-btn {
            padding: 10px 22px;
            border-radius: 8px;
            border: 2px solid #333;
            background: #141414;
            color: var(--text-gray);
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s;
        }

        .theme-btn:hover {
            border-color: var(--orange);
            color: var(--text-light);
        }

        .theme-btn.active {
            border-color: var(--primary-red);
            background: rgba(230, 57, 70, 0.12);
            color: var(--text-light);
        }

        .play-btn {
            padding: 16px 48px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--dark-red) 0%, var(--primary-red) 100%);
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 30px rgba(230, 57, 70, 0.45);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(230, 57, 70, 0.6);
        }

        .controls .hint {
            font-size: 0.78rem;
            color: #777;
            max-width: 460px;
            text-align: center;
            line-height: 1.7;
        }

        .controls .hint kbd {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 1px 7px;
            font-family: inherit;
            color: var(--text-gray);
        }

        .sound-toggle {
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .sound-toggle:hover {
            color: var(--orange);
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="bg"></div>
        <div class="grain"></div>
        <div class="vignette"></div>

        <div class="hook">
            <div class="hook-kicker" id="kicker"></div>
            <div class="hook-line" id="line"></div>
            <div class="hook-punch" id="punch"></div>
        </div>

        <div class="beat-mark">
            <div class="brand">Mind Over Margin</div>
            <div class="cue">12x</div>
        </div>
    </div>

    <div class="controls" id="controls">
        <h1>Mind Over Margin <span>12x</span> — Intro Hook</h1>

        <div class="theme-row" id="themeRow"></div>

        <button class="play-btn" id="playBtn">Play Hook</button>
        <button class="sound-toggle" id="soundToggle">Sound: On</button>

        <p class="hint">
            Pick a theme, hit <kbd>Space</kbd> or Play, and screen-record the ~6.5s
            sequence at 1080p to prepend to the video. Keys <kbd>1</kbd>–<kbd>3</kbd>
            switch themes, <kbd>R</kbd> replays, <kbd>M</kbd> mutes the atmosphere.
            The final brand flash marks exactly where the first beat should hit.
        </p>
    </div>

    <script>
        // Three testable hooks — one per emotional theme. Each turns the viewer
        // from a passive listener into someone waiting for the lyrics to answer
        // their own question.
        const THEMES = {
            regret: {
                label: 'Regret',
                kicker: 'Before you press play',
                line: 'If you could undo <em>one trade</em> you made five years ago&hellip;',
                punch: 'would you?'
            },
            hope: {
                label: 'Hope',
                kicker: 'A question first',
                line: 'What if the <em>next decision</em> is the one that changes everything?',
                punch: 'This song is about making it.'
            },
            confusion: {
                label: 'Confusion',
                kicker: 'Be honest',
                line: 'Your head says <em>stop</em>. Your gut says <em>double it</em>.',
                punch: 'Which one is lying to you?'
            }
        };

        const HOOK_DURATION_MS = 7200; // full sequence incl. beat marker hold

        const stage = document.getElementById('stage');
        const controls = document.getElementById('controls');
        const themeRow = document.getElementById('themeRow');
        const playBtn = document.getElementById('playBtn');
        const soundToggle = document.getElementById('soundToggle');

        const params = new URLSearchParams(location.search);
        let currentTheme = THEMES[params.get('theme')] ? params.get('theme') : 'regret';
        let soundOn = params.get('sound') !== 'off';
        let playTimer = null;

        Object.entries(THEMES).forEach(([key, theme]) => {
            const btn = document.createElement('button');
            btn.className = 'theme-btn';
            btn.dataset.theme = key;
            btn.textContent = theme.label;
            btn.addEventListener('click', () => selectTheme(key));
            themeRow.appendChild(btn);
        });

        function selectTheme(key) {
            currentTheme = key;
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === key);
            });
            const theme = THEMES[key];
            document.getElementById('kicker').textContent = theme.kicker;
            document.getElementById('line').innerHTML = theme.line;
            document.getElementById('punch').textContent = theme.punch;
        }

        function updateSoundLabel() {
            soundToggle.textContent = 'Sound: ' + (soundOn ? 'On' : 'Off');
        }

        soundToggle.addEventListener('click', () => {
            soundOn = !soundOn;
            updateSoundLabel();
        });

        // Minimal atmospheric bed, generated with the Web Audio API so the page
        // stays fully self-contained: a low drone that swells, plus two heartbeat
        // thumps leading into the beat marker.
        function playAtmosphere() {
            if (!soundOn) return;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const master = ctx.createGain();
            master.gain.value = 0.6;
            master.connect(ctx.destination);

            const drone = ctx.createOscillator();
            drone.type = 'sine';
            drone.frequency.value = 52;
            const droneGain = ctx.createGain();
            droneGain.gain.setValueAtTime(0.0001, ctx.currentTime);
            droneGain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 2.2);
            droneGain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 5.0);
            droneGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 6.3);
            drone.connect(droneGain).connect(master);
            drone.start();
            drone.stop(ctx.currentTime + 6.5);

            const shimmer = ctx.createOscillator();
            shimmer.type = 'sine';
            shimmer.frequency.setValueAtTime(392, ctx.currentTime);
            shimmer.frequency.linearRampToValueAtTime(440, ctx.currentTime + 5.5);
            const shimmerGain = ctx.createGain();
            shimmerGain.gain.setValueAtTime(0.0001, ctx.currentTime);
            shimmerGain.gain.exponentialRampToValueAtTime(0.035, ctx.currentTime + 3.0);
            shimmerGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 6.0);
            shimmer.connect(shimmerGain).connect(master);
            shimmer.start();
            shimmer.stop(ctx.currentTime + 6.2);

            [4.9, 5.5].forEach(t => {
                const thump = ctx.createOscillator();
                thump.type = 'sine';
                thump.frequency.setValueAtTime(110, ctx.currentTime + t);
                thump.frequency.exponentialRampToValueAtTime(45, ctx.currentTime + t + 0.18);
                const thumpGain = ctx.createGain();
                thumpGain.gain.setValueAtTime(0.0001, ctx.currentTime + t);
                thumpGain.gain.exponentialRampToValueAtTime(0.5, ctx.currentTime + t + 0.02);
                thumpGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.35);
                thump.connect(thumpGain).connect(master);
                thump.start(ctx.currentTime + t);
                thump.stop(ctx.currentTime + t + 0.4);
            });

            setTimeout(() => ctx.close(), 7000);
        }

        function playHook() {
            clearTimeout(playTimer);
            controls.classList.add('hidden');
            stage.classList.remove('playing');
            // Force a reflow so replaying restarts every animation from zero
            void stage.offsetWidth;
            stage.classList.add('playing');
            playAtmosphere();
            playTimer = setTimeout(() => {
                stage.classList.remove('playing');
                controls.classList.remove('hidden');
            }, HOOK_DURATION_MS);
        }

        playBtn.addEventListener('click', playHook);

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key.toLowerCase() === 'r') {
                e.preventDefault();
                playHook();
            } else if (e.key.toLowerCase() === 'm') {
                soundOn = !soundOn;
                updateSoundLabel();
            } else {
                const keys = Object.keys(THEMES);
                const idx = parseInt(e.key, 10) - 1;
                if (idx >= 0 && idx < keys.length) selectTheme(keys[idx]);
            }
        });

        selectTheme(currentTheme);
        updateSoundLabel();
    </script>
</body>
</html>
